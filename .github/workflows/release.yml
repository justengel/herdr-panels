name: Release

# A push to master runs CI first. This workflow starts after that run
# succeeds, and it creates the version tag only after the archives build.
# Pushing a tag does not publish a release.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: version
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v${version}" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v${version} already exists"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v${version} will be published from ${RELEASE_SHA}"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
          - os: windows-latest
            asset: windows-x64
          - os: macos-latest
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x64
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libwayland-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Page
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --target-dir target
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          name="herdr-panels-${version}-${{ matrix.asset }}"
          mkdir -p "$name"
          cp target/release/herdr-panels target/release/herdr-panels-desktop "$name/"
          cp LICENSE README.md "$name/"
          tar -czf "${name}.tar.gz" "$name"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $name = "herdr-panels-$version-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path $name | Out-Null
          Copy-Item target/release/herdr-panels.exe, target/release/herdr-panels-desktop.exe -Destination $name
          Copy-Item LICENSE, README.md -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            herdr-panels-*.tar.gz
            herdr-panels-*.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          generate_release_notes: true
          files: dist/*
