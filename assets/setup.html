<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herdr Panels</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101114;
      color: #e7e4dc;
      font: 15px/1.5 "Segoe UI", sans-serif;
    }
    main {
      width: min(640px, calc(100% - 48px));
      padding: 28px 28px 24px;
      border: 1px solid #2a2f38;
      background: #181b20;
    }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: #c8c3b8; }
    code, a { color: #e2b657; }
    a { text-underline-offset: 3px; }
    ol { margin: 0; padding-left: 18px; color: #c8c3b8; }
    li + li { margin-top: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Herdr Panels is running</h1>
    <p>The API is up on this port. The browser UI has not been built into <code>web/dist</code> yet.</p>
    <ol>
      <li>In another terminal, run <code>npm install</code> and <code>npm run dev</code> inside <code>web</code>.</li>
      <li>Open <a href="http://127.0.0.1:5173">http://127.0.0.1:5173</a>.</li>
      <li>Or run <code>npm run build</code> and refresh this page to use the built UI.</li>
    </ol>
  </main>
</body>
</html>
