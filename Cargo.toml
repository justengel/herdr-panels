[package]
name = "herdr-panels"
version = "0.1.2"
edition = "2021"
description = "Local multi-panel browser client for Herdr"
license = "MIT"
repository = "https://github.com/justengel/herdr-panels"
readme = "README.md"
publish = false

[lib]
name = "herdr_panels"
path = "src/lib.rs"

[[bin]]
name = "herdr-panels"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = { version = "0.2", features = ["std"] }
include_dir = "0.7"
mime_guess = "2"
notify = "6"
reqwest = "0.12"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
