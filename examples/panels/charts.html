<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14181f;
      --card: #101114;
      --line: #2a2f38;
      --text: #e7e4dc;
      --muted: #9aa3b2;
      --gold: #e2b657;
      --green: #7dcea0;
      --blue: #8eb6ff;
      --coral: #e07a5f;
      --violet: #c4b5fd;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 "Segoe UI", sans-serif;
    }
    .page {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 20px 20px;
      min-height: 560px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .range {
      color: var(--muted);
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .stat { padding: 12px 14px; }
    .stat b {
      display: block;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat em {
      font-style: normal;
      color: var(--green);
      font-size: 12px;
      margin-left: 6px;
    }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(240px, 0.85fr);
      grid-template-rows: minmax(0, 1.2fr) minmax(180px, 0.8fr);
      gap: 12px;
    }
    .card {
      padding: 14px 16px 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .wide { min-width: 0; }
    .side { grid-column: 2; grid-row: 1 / span 2; }
    svg { width: 100%; height: 100%; display: block; }
    .axis { fill: var(--muted); font-size: 11px; }
    .grid { stroke: #232830; stroke-width: 1; }
    .area { fill: rgba(226, 182, 87, 0.16); }
    .line { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: var(--gold); }
    .bars { display: grid; gap: 10px; margin: auto 0; }
    .bar {
      display: grid;
      grid-template-columns: 84px 1fr 28px;
      gap: 10px;
      align-items: center;
    }
    .bar span { color: var(--text); font-size: 13px; }
    .track {
      height: 8px;
      background: #1c2129;
      border-radius: 999px;
      overflow: hidden;
    }
    .fill { display: block; height: 100%; border-radius: inherit; }
    .bar b { font-weight: 600; font-size: 12px; text-align: right; color: var(--muted); }
    .donut-wrap {
      flex: 1;
      display: grid;
      grid-template-columns: 168px 1fr;
      gap: 8px;
      align-items: center;
      min-height: 0;
    }
    .ring { position: relative; width: 168px; height: 168px; margin: 0 auto; }
    .ring svg { transform: rotate(-90deg); }
    .center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      text-align: center;
    }
    .center strong { font-size: 22px; font-weight: 600; }
    .center span { color: var(--muted); font-size: 12px; }
    .legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .legend li { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .legend b { margin-left: auto; color: var(--text); font-weight: 600; }
    @media (max-width: 820px) {
      .page { height: auto; min-height: 100%; }
      .stats { grid-template-columns: 1fr 1fr; }
      main { grid-template-columns: 1fr; grid-template-rows: 280px auto 320px; }
      .side { grid-column: 1; grid-row: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Workspace</h1>
        <p class="sub">Pane output, panel mix, and time in each layout.</p>
      </div>
      <div class="range">Mon 19 – Sun 25</div>
    </header>

    <section class="stats">
      <div class="stat"><b>6<em>+2</em></b><span>Open panes</span></div>
      <div class="stat"><b>14<em>+3</em></b><span>Notes</span></div>
      <div class="stat"><b>3</b><span>Plugins</span></div>
      <div class="stat"><b>4</b><span>Layouts</span></div>
    </section>

    <main>
      <section class="card wide">
        <h2>Lines written</h2>
        <svg viewBox="0 0 720 220" role="img" aria-label="Lines written from Monday to Sunday">
          <line class="grid" x1="48" y1="24" x2="700" y2="24" />
          <line class="grid" x1="48" y1="80" x2="700" y2="80" />
          <line class="grid" x1="48" y1="136" x2="700" y2="136" />
          <line class="grid" x1="48" y1="190" x2="700" y2="190" />
          <text class="axis" x="40" y="28" text-anchor="end">80</text>
          <text class="axis" x="40" y="84" text-anchor="end">50</text>
          <text class="axis" x="40" y="140" text-anchor="end">20</text>
          <text class="axis" x="40" y="194" text-anchor="end">0</text>
          <path class="area" d="M48 134 C100 134 116 106 157 106 C210 106 220 114 265 113 C320 112 330 68 374 68 C430 68 440 82 483 82 C540 82 548 124 591 124 C650 124 660 100 700 100 L700 190 L48 190 Z" />
          <path class="line" d="M48 134 C100 134 116 106 157 106 C210 106 220 114 265 113 C320 112 330 68 374 68 C430 68 440 82 483 82 C540 82 548 124 591 124 C650 124 660 100 700 100" />
          <circle class="dot" cx="48" cy="134" r="3.5" />
          <circle class="dot" cx="157" cy="106" r="3.5" />
          <circle class="dot" cx="265" cy="113" r="3.5" />
          <circle class="dot" cx="374" cy="68" r="3.5" />
          <circle class="dot" cx="483" cy="82" r="3.5" />
          <circle class="dot" cx="591" cy="124" r="3.5" />
          <circle class="dot" cx="700" cy="100" r="3.5" />
          <text class="axis" x="48" y="212" text-anchor="middle">Mon</text>
          <text class="axis" x="157" y="212" text-anchor="middle">Tue</text>
          <text class="axis" x="265" y="212" text-anchor="middle">Wed</text>
          <text class="axis" x="374" y="212" text-anchor="middle">Thu</text>
          <text class="axis" x="483" y="212" text-anchor="middle">Fri</text>
          <text class="axis" x="591" y="212" text-anchor="middle">Sat</text>
          <text class="axis" x="700" y="212" text-anchor="middle">Sun</text>
        </svg>
      </section>

      <section class="card side">
        <h2>Time in layout</h2>
        <div class="donut-wrap">
          <div class="ring">
            <svg viewBox="0 0 168 168" role="img" aria-label="Time spent in three layouts">
              <circle cx="84" cy="84" r="58" fill="none" stroke="#1c2129" stroke-width="16" />
              <circle cx="84" cy="84" r="58" fill="none" stroke="#e2b657" stroke-width="16"
                stroke-dasharray="204 364.4" stroke-linecap="butt" />
              <circle cx="84" cy="84" r="58" fill="none" stroke="#8eb6ff" stroke-width="16"
                stroke-dasharray="94 364.4" stroke-dashoffset="-208" />
              <circle cx="84" cy="84" r="58" fill="none" stroke="#7dcea0" stroke-width="16"
                stroke-dasharray="50 364.4" stroke-dashoffset="-306" />
            </svg>
            <div class="center"><strong>18h</strong><span>this week</span></div>
          </div>
          <ul class="legend">
            <li><i class="swatch" style="background:#e2b657"></i>Side by side<b>58%</b></li>
            <li><i class="swatch" style="background:#8eb6ff"></i>Desk<b>27%</b></li>
            <li><i class="swatch" style="background:#7dcea0"></i>Focus<b>15%</b></li>
          </ul>
        </div>
      </section>

      <section class="card">
        <h2>Panels on the desk</h2>
        <div class="bars">
          <div class="bar"><span>Terminal</span><div class="track"><i class="fill" style="width:86%;background:#e2b657"></i></div><b>18</b></div>
          <div class="bar"><span>Notes</span><div class="track"><i class="fill" style="width:62%;background:#8eb6ff"></i></div><b>13</b></div>
          <div class="bar"><span>Browser</span><div class="track"><i class="fill" style="width:38%;background:#7dcea0"></i></div><b>8</b></div>
          <div class="bar"><span>HTML</span><div class="track"><i class="fill" style="width:24%;background:#e07a5f"></i></div><b>5</b></div>
          <div class="bar"><span>Plugin</span><div class="track"><i class="fill" style="width:14%;background:#c4b5fd"></i></div><b>3</b></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
