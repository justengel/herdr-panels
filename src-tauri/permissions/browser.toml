[[permission]]
identifier = "allow-place-browser"
description = "Place or move the child webview for a browser panel."
commands.allow = ["place_browser"]

[[permission]]
identifier = "allow-close-browser"
description = "Close the child webview for a browser panel."
commands.allow = ["close_browser"]

[[permission]]
identifier = "allow-adopt-browser"
description = "Keep a browser page when its panel becomes a tab."
commands.allow = ["adopt_browser"]

[[permission]]
identifier = "allow-snapshot-browser"
description = "Read a browser webview's pixels so a screenshot includes the page, not the empty hole behind it."
commands.allow = ["snapshot_browser"]

[[permission]]
identifier = "allow-snapshot-view"
description = "Take a pixel snapshot of the desktop window for the Screenshot button."
commands.allow = ["snapshot_view"]

[[permission]]
identifier = "allow-eval-browser"
description = "Run a host-built script in a browser panel. Remote pages cannot call this."
commands.allow = ["eval_browser"]

[[permission]]
identifier = "allow-set-browser-select"
description = "Turn element selection on or off inside browser panels."
commands.allow = ["set_browser_select"]

[[permission]]
identifier = "allow-set-display-zoom"
description = "Scale the desktop window and every browser panel together."
commands.allow = ["set_display_zoom"]

[[permission]]
identifier = "allow-set-browser-zoom"
description = "Scale one browser panel."
commands.allow = ["set_browser_zoom"]

[[permission]]
identifier = "allow-cursor-place"
description = "Ask whether the pointer is over the desk, a browser panel, or neither."
commands.allow = ["cursor_place"]

[[permission]]
identifier = "allow-set-desk-prefix"
description = "Tell the desktop window which prefix chord a browser panel should hand to the desk."
commands.allow = ["set_desk_prefix"]

[[permission]]
identifier = "allow-set-frame-focus"
description = "Tell the desktop window when a plugin or HTML frame has the keyboard."
commands.allow = ["set_frame_focus"]

[[permission]]
identifier = "allow-open-external"
description = "Open an http or https URL in the system browser. Other schemes are refused by the command."
commands.allow = ["open_external"]

[[permission]]
identifier = "allow-set-cli-access"
description = "Turn CLI access on from the desktop window."
commands.allow = ["set_cli_access"]

[[permission]]
identifier = "allow-answer-panel-unlock"
description = "Confirm or cancel unlocking a panel from the desktop window."
commands.allow = ["answer_panel_unlock"]
